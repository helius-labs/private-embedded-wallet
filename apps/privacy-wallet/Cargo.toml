[package]
name = "zolana-tvc-privacy-wallet"
version = "0.1.0"
description = "Attested privacy-key backend for Zolana wallets"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false
autobins = false

[features]
default = []
# Compile-time-only local harness. The enclave binary and Dockerfile never
# enable this feature or link the mock custody implementation.
local-dev = ["dep:ed25519-dalek", "dep:reqwest", "spr-prover-tee/test-fixtures", "spr-tvc-enclave/local-dev"]

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio"] }
async-trait = "=0.1.89"
base64 = "=0.22.1"
borsh = { version = "=1.7.0", features = ["derive"] }
clap = { version = "=4.5.53", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"], optional = true }
hex = "=0.4.3"
qos_p256 = { version = "=0.12.1", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
# The local stand-in prover's client; the enclave's Turnkey client brings its own.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"], optional = true }
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
solana-pubkey = "=4.2.0"
tokio = { version = "=1.48.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "time"] }
turnkey_api_key_stamper = "=0.14.0"
turnkey_client = "=0.14.0"
uuid = { version = "=1.25.0", default-features = false }
zeroize = "=1.9.0"
spr-keypair = { git = "https://github.com/helius-labs/zolana.git", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-prover-tee = { git = "https://github.com/helius-labs/zolana.git", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-transaction = { git = "https://github.com/helius-labs/zolana.git", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676" }
spr-tvc-enclave = { path = "../../crates/enclave" }
zolana-tvc-protocol = { path = "../../crates/protocol" }

[dev-dependencies]
spr-tvc-enclave = { path = "../../crates/enclave", features = ["testing"] }
spr-prover-tee = { git = "https://github.com/helius-labs/zolana.git", rev = "c5297afa13e8bfb6edadf6408304ef3fc2f8c676", features = ["test-fixtures"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
http-body-util = "=0.1.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "zolana-tvc-privacy-wallet"
path = "src/main.rs"

[[bin]]
name = "zolana-tvc-privacy-wallet-local"
path = "src/bin/local.rs"
required-features = ["local-dev"]
