# Publishes apps/privacy-wallet into the GHCR package named by `imageRepository`
# in apps/privacy-wallet/deploy/release.json, tagged with the network whose
# signed prover policy it accepts and the commit. Turnkey
# pulls it anonymously, so the package must be public. The release continues
# on an operator's machine with the reference from the run summary:
#   just release <network> <release-id> --image <reference>

name: publish-privacy-wallet-image

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network whose signed prover policy the image accepts
        type: choice
        options: [devnet, mainnet]
        required: true

permissions:
  contents: read

concurrency:
  group: publish-privacy-wallet-image-${{ inputs.network }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: image-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: image
        env:
          NETWORK: ${{ inputs.network }}
        run: echo "tag=$(jq -r .imageRepository apps/privacy-wallet/deploy/release.json):privacy-wallet-${NETWORK}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One linux/amd64 manifest without attestations, which Turnkey pulls.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/privacy-wallet/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: SPR_NETWORK=${{ inputs.network }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=privacy-wallet-${{ inputs.network }}
          cache-to: type=gha,mode=max,scope=privacy-wallet-${{ inputs.network }}

      - name: Report pinned reference
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          pivot_digest="$(docker run --rm --platform linux/amd64 --entrypoint sha256sum "$IMAGE" /tvc_app | cut -d' ' -f1)"
          {
            echo "### privacy-wallet (${{ inputs.network }})"
            echo '```'
            echo "image:           $IMAGE"
            echo "/tvc_app sha256: $pivot_digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
