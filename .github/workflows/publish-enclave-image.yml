# Publishes one enclave application into the GHCR package named by
# `imageRepository` in its apps/<app>/deploy/release.json, tagged with the
# network it was built for and the commit. Turnkey pulls it anonymously, so the
# package must be public. The release continues on an operator's machine with
# the reference from the run summary:
#   just release <network> <release-id> --app <app> --image <reference>

name: publish-enclave-image

on:
  workflow_dispatch:
    inputs:
      app:
        description: Enclave application
        type: choice
        options: [privacy-wallet, decryption-service]
        required: true
      network:
        description: Network the image is built for
        type: choice
        options: [devnet, mainnet]
        required: true

permissions:
  contents: read

concurrency:
  group: publish-enclave-image-${{ inputs.app }}-${{ inputs.network }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: image-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: image
        env:
          APP: ${{ inputs.app }}
          NETWORK: ${{ inputs.network }}
        run: |
          release="apps/${APP}/deploy/release.json"
          echo "tag=$(jq -r .imageRepository "$release"):${APP}-${NETWORK}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "package=$(jq -r .package "$release")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One linux/amd64 manifest without attestations, which Turnkey pulls.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/enclave.Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            SPR_NETWORK=${{ inputs.network }}
            APP_PACKAGE=${{ steps.image.outputs.package }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ inputs.network }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ inputs.network }}

      - name: Report pinned reference
        env:
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          pivot_digest="$(docker run --rm --platform linux/amd64 --entrypoint sha256sum "$IMAGE" /tvc_app | cut -d' ' -f1)"
          {
            echo "### ${{ inputs.app }} (${{ inputs.network }})"
            echo '```'
            echo "image:           $IMAGE"
            echo "/tvc_app sha256: $pivot_digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
